[package]
name = "nuza"
version = "0.1.13"
description = "A fast, privacy-first, local-first markdown notes app"
authors = ["puang59"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nuza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.0"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2"
fontdb = "0.24.0"
ttf-parser = "0.25"
base64 = "0.22"
# Notes are written to a temporary file and renamed over the target, so a
# crash mid-save cannot truncate one.
tempfile = "3"
# Notices a note being changed underneath the app - by a sync client, a
# git checkout, or another editor.
notify = "8"

# A rename that refuses to replace what is already there. Every platform has
# one and none of them is `fs::rename`, which is why these are here.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Which Windows this is, so the window gets the backdrop that does not make
# dragging it crawl. window-vibrancy reads the same crate for the same reason.
# windows-sys is for MoveFileExW, for the same reason libc is above.
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
